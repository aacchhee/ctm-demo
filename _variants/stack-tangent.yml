            "note": "f(x)=(x-($3$))/(x-($2$)); tangentpunkt x0=$-1$.",
            "solution": "Vi har $u'(x)=1$ og $v'(x)=1$. Brøkregelen gir\n\n$$f'(x)=\\frac{(x-({2}))-(x-({3}))}{(x-({2}))^2}=\\frac{ {3}-({2}) }{(x-({2}))^2}.$$\nTangentpunktets høyde er $f({-1})=\\frac{ {-1}-({3}) }{ {-1}-({2}) }$, og stigningstallet er $f'({-1})=\\frac{ {3}-({2}) }{({-1}-({2}))^2}$.\n\n$$y=\\frac{ {-1}-({3}) }{ {-1}-({2}) }+\\frac{ {3}-({2}) }{({-1}-({2}))^2}(x-({-1})).$$\nAlgebraisk likeverdige former godtas. I figuren under kan du flytte tangentpunktet og se hvordan stigningstallet endres.",
            "question": "Finn den deriverte og tangenten til $f(x)=\\dfrac{x-({3})}{x-({2})}$ i punktet $({-1},f({-1}))$. Funksjonen er ikke definert når $x={2}$.\nBruk brøkregelen $\\left(\\dfrac{u}{v}\\right)'=\\dfrac{u'v-uv'}{v^2}$, med $u(x)=x-({3})$ og $v(x)=x-({2})$.\nSkriv **eksakte uttrykk**; bruk brøker i stedet for avrundede desimaltall.\n\n$u'(x)=$ _[1], $v'(x)=$ _[1]\n\n$f'(x)=$ __[(3-(2))/(x-(2))^2]\n\nTangenten har likning $y=$ __[(-1-(3))/(-1-(2))+(3-(2))/(-1-(2))^2*(x-(-1))]",
