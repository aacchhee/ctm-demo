name: Variants
# Paused: the variants pipeline is to be redone. Runs only when started by hand
# (Actions -> Run workflow); restore the automatic triggers when it is redone.
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact PR head to check
        required: true
        type: string
      pull_request:
        description: Same-repository PR number
        required: true
        type: string
      generate_more:
        description: Optional native question label to generate up to 25 more tested proposals without saving
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  variants-records:
    # The installation PR cannot use a trusted default-branch producer until
    # this workflow and its inventory have landed. Its separate native pipeline
    # regression tests the package on that branch without privileged effects.
    if: github.event_name == 'workflow_dispatch' || github.head_ref != 'automation/2026-10-variants-approval'
    # Authored variables/checkers run only in this unprivileged job. Forks can
    # be checked, while the separate privileged sticky/decide jobs reject them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: authored
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.8.27'
      - name: Install reviewed native Python dependencies
        run: python -m pip install --requirement trusted/.github/ctm-variants-requirements.txt
      - name: Materialize the frozen trusted review package
        run: python -I trusted/.github/scripts/bootstrap-variants.py
      - name: Produce exact-head tested records and canonical review HTML
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I trusted/.github/scripts/ctm-variants-records.py --project authored --trusted trusted --output "$RUNNER_TEMP/ctm-variants"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ctm-variants-records
          path: ${{ runner.temp }}/ctm-variants/variants-records.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ctm-pool-checks
          path: ${{ runner.temp }}/ctm-variants/pool-checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ctm-variants-review
          path: ${{ runner.temp }}/ctm-variants/review/
          if-no-files-found: warn
  check:
    name: variants / check
    needs: variants-records
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: authored
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ctm-variants-records
          path: ${{ runner.temp }}/ctm-variants
      - name: Materialize the frozen trusted review package
        run: python -I trusted/.github/scripts/bootstrap-variants.py
      - name: Enforce current required approvals independently of review output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I trusted/.github/scripts/ctm-variants-records.py --project authored --trusted trusted --output "$RUNNER_TEMP/ctm-variants" --check
