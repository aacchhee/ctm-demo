name: Variants automated approval regression
# Paused: the variants pipeline is to be redone. Runs only when started by hand
# (Actions -> Run workflow); restore the automatic triggers when it is redone.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    name: generation / approval / publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.8.27'
      - name: Install pinned native dependencies
        run: python -m pip install --requirement .github/ctm-variants-requirements.txt
      - name: Verify and materialize the exact frozen tooling
        run: python -I .github/scripts/bootstrap-variants.py
      - name: Verify archive tamper controls and the producer closure
        run: python -I scripts/test-variants-installation.py
      - name: Exercise generation, automatic approval and student publication
        run: python -I scripts/test-variants-pipeline.py
