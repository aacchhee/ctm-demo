name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This isolated candidate has its own source checks and artifact-only render.
    # The existing manual build (including STACK) and main publication stay available.
    if: github.ref != 'refs/heads/consolidation/2026-10-demo-native-authoring' && github.head_ref != 'consolidation/2026-10-demo-native-authoring' && (github.event_name != 'pull_request' || github.head_ref != 'consolidation/2026-10-saving-quiz-candidate' && github.head_ref != 'consolidation/2026-10-merged-package-demo')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # SymPy: the version Pyodide ships, so that build-time checks (STACK variants) match the browser (audit F-11).
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r _stack-audit/requirements.txt sympy==1.13.3
      - name: Install Quarto extensions
        run: python scripts/setup.py --review-refs "$CTM_REVIEW_REFS"
      - name: Render website
        run: quarto render
      - name: Record Similar problems guide provenance
        run: python scripts/build-similar-problems.py --record-only
      - name: Build the temporary JSXGraph reproduction (old commits)
        run: scripts/build-jsxgraph-repro.sh
      - name: Test STACK audit statistics
        run: python scripts/test-stack-audit-statistics.py
      - name: Build the standalone STACK question audit
        run: python scripts/build-stack-audit.py
      - name: Render optional STACK review
        env:
          CTM_VARIANTS: review
        run: quarto render pages/stack-oppgaver.qmd --profile variants-review
      - name: Verify generated STACK variants
        run: python scripts/check-stack-native-authoring.py _variants-review-site/pages/stack-oppgaver.html
      - name: Save rendered website
        uses: actions/upload-artifact@v7
        with:
          name: ctm-demo-site
          path: _site
  publish:
    concurrency:
      group: ctm-pages-${{ github.repository }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.head_ref != 'consolidation/2026-10-demo-native-authoring'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the read-only build output
        uses: actions/download-artifact@v7
        with:
          name: ctm-demo-site
          path: _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true


