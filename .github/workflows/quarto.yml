name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r _stack-audit/requirements.txt
      - name: Install Quarto extensions
        run: python scripts/setup.py --review-refs "$CTM_REVIEW_REFS"
      - name: Render website
        run: quarto render
      - name: Build the temporary JSXGraph reproduction (old commits)
        run: scripts/build-jsxgraph-repro.sh
      - name: Test STACK audit statistics
        run: python scripts/test-stack-audit-statistics.py
      - name: Build the standalone STACK question audit
        run: python scripts/build-stack-audit.py
      - name: Render optional STACK review
        run: quarto render --profile review
      - name: Verify generated STACK variants
        run: python scripts/check-stack-variants.py
      - name: Save rendered website
        uses: actions/upload-artifact@v4
        with:
          name: ctm-demo-site
          path: _site
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the read-only build output
        uses: actions/download-artifact@v4
        with:
          name: ctm-demo-site
          path: _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages


