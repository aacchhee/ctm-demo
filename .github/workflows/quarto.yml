name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Quarto extensions
        run: python scripts/setup.py --review-refs "$CTM_REVIEW_REFS"
      - name: Render website
        run: quarto render
      - name: Build the temporary JSXGraph reproduction (old commits)
        run: scripts/build-jsxgraph-repro.sh
      - name: Render optional STACK review
        run: quarto render --profile review
      - name: Verify generated STACK variants
        run: python scripts/check-stack-variants.py
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
