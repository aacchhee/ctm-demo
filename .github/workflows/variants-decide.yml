name: Variants record decisions
# Paused: the variants pipeline is to be redone. Runs only when started by hand
# (Actions -> Run workflow); restore the automatic triggers when it is redone.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Same-repository pull request number
        required: true
        type: string
      comment_id:
        description: Existing own bot checklist comment ID
        required: true
        type: string
permissions: {}
concurrency:
  group: variants-decide-${{ github.repository }}-${{ github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false
jobs:
  decide:
    if: (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '<!-- ctm-question:')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # This file must be installed/reviewed on the protected default branch.
      # Never replace this ref with an event's PR branch or checkout PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-26
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Materialize the frozen trusted review package
        run: python -I .github/scripts/bootstrap-variants.py
      - name: Record exact-head neutral artifact decisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        # A course installs the reviewed native-only closure at this path.
        # No event text is interpolated into a shell command.
        run: python -I _extensions/ctm-checkers/native-authoring/ctm-variants-bot.py --producer-manifest .github/ctm-variants-producer.json
