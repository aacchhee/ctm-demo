name: Build Similar problems guide

on:
  # No path filters: every PR must rebuild the complete three-page guide.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: similar-problems-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r requirements.txt sympy==1.13.3
      - name: Install the exact package pin
        run: python scripts/setup.py
      - name: Build all three pages and record provenance
        run: python scripts/build-similar-problems.py
      - uses: actions/upload-artifact@v4
        with:
          name: similar-problems-guide
          path: _site
      - name: Link the rendered artifact
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "All three pages rebuilt. Download the similar-problems-guide artifact from [this run]($RUN_URL). PR builds do not publish." >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    # Never give PR code a publishing token. Manual branch publication is an
    # explicit maintainer action; main publication follows a reviewed merge.
    if: github.repository == 'aacchhee/ctm-demo' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ctm-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: similar-problems-guide
          path: preview
      - name: Publish the guide while preserving existing course pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          destination_dir: ${{ github.ref == 'refs/heads/main' && 'similar-problems' || 'similar-problems-preview' }}
          publish_branch: gh-pages
          keep_files: true
      - name: Link the public guide
        env:
          GUIDE_DIR: ${{ github.ref == 'refs/heads/main' && 'similar-problems' || 'similar-problems-preview' }}
        run: echo "[Open the three-page guide](https://aacchhee.github.io/ctm-demo/$GUIDE_DIR/pages/similar-problems.html)" >> "$GITHUB_STEP_SUMMARY"
