name: Publish Similar problems preview

on:
  push:
    branches: [similar-problems/testbox]
    paths:
      - pages/similar-problems.qmd
      - feedback/similar-problems.yml
      - quarto-extensions.yml
      - .github/workflows/similar-problems-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'aacchhee/ctm-demo' && github.ref == 'refs/heads/similar-problems/testbox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r requirements.txt sympy==1.13.3
      - name: Install the exact package pin
        run: python scripts/setup.py
      - name: Build the three-exercise public testbox
        run: quarto render pages/similar-problems.qmd
      - name: Record the published source and component pins
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          record=json.loads(pathlib.Path('.private-extensions/resolved-repos.json').read_text())
          record['previewSourceHead']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          pathlib.Path('_site/similar-problems-build.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: similar-problems-public-preview
          path: _site
  publish:
    needs: build
    if: github.repository == 'aacchhee/ctm-demo' && github.ref == 'refs/heads/similar-problems/testbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ctm-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: similar-problems-public-preview
          path: preview
      - name: Publish the preview subtree while preserving the existing site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          destination_dir: similar-problems-pr-28
          publish_branch: gh-pages
          keep_files: true
