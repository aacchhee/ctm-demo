name: First-start network trace (diagnostic artifacts only)
on:
  pull_request:
    paths:
      - .github/workflows/first-start-network-trace.yml
      - .github/first-start-network-refs.json
      - scripts/diagnostics/test-demo-first-visit-network.mjs
      - scripts/diagnostics/probe-coi-head.mjs
# Diagnostic only: unchanged full91be harness copied byte-for-byte to preserve
# raw failures while recording actual CDN/SW HTTP methods and headers. No
# production fix, filter, stubs or course/first-visit clearance is implied.
permissions:
  contents: read
concurrency:
  group: first-start-network-trace-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.number == 20 && github.head_ref == 'consolidation/2026-10-demo-native-authoring' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate the exact component tuple
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          refs = json.loads(pathlib.Path('.github/first-start-network-refs.json').read_text())
          expected = {'ctm-assessment','ctm-libs','ctm-checkers','math-exercise','py-exercise','pyodide-interaktiv','jsxgraph'}
          assert set(refs) == expected and all(re.fullmatch('[0-9a-f]{40}', x) for x in refs.values())
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['EXPECTED_HEAD']
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('CTM_FIRST_START_REFS=' + json.dumps(refs,sort_keys=True) + '\n')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install the frozen canonical pack
        run: |
          python -m pip install -r requirements.txt sympy==1.13.3
          python scripts/setup.py --review-refs "$CTM_FIRST_START_REFS"
      - name: Render only the original first-visit page
        run: |
          set -o pipefail
          mkdir -p first-start-network-build
          quarto render pages/step4-ui.qmd --profile saving-quiz 2>&1 | tee first-start-network-build/render.log
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          site=pathlib.Path('_saving-quiz-site')
          files={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(site.rglob('*')) if p.is_file()}
          assert 'pages/step4-ui.html' in files and 'coi-serviceworker.js' in files
          pathlib.Path('first-start-network-build/record.json').write_text(json.dumps({'sourceHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'refs':json.loads(pathlib.Path('.github/first-start-network-refs.json').read_text()),'files':files},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-start-network-site-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          path: |
            _saving-quiz-site
            .private-extensions/resolved-repos.json
            first-start-network-build
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: first-start-network-site-${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact browser harness
        run: |
          npm install --prefix .first-start-tooling --no-save --ignore-scripts playwright@1.62.1
          .first-start-tooling/node_modules/.bin/playwright install --with-deps chromium
          echo "CTM_PLAYWRIGHT_MODULE=file://$PWD/.first-start-tooling/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Original static first visit, real runtime and opaque board
        run: node scripts/diagnostics/test-demo-first-visit-network.mjs --site _saving-quiz-site --browser chromium --output first-start-network/baseline.json
      - name: Diagnostic CDN HEAD transport comparison with the canonical service worker
        if: ${{ !cancelled() }}
        run: node scripts/diagnostics/probe-coi-head.mjs --site _saving-quiz-site --output first-start-network/nettrace-head.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-start-network-chromium-${{ github.event.pull_request.head.sha }}
          path: first-start-network
