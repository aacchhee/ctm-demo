project:
  type: website
  render:
    - index.qmd
    - pages/experiments.qmd
    - pages/gaussian-elimination.qmd
    - pages/physics.qmd
    - pages/fysikk-forkurs.qmd
    - pages/bevegelse-ii.qmd
    - pages/stack-oppgaver.qmd
    - pages/help.qmd
    - pages/step4-ui.qmd
    - pages/step4-ui-links.qmd
    - pages/step4-ui-nb.qmd
    - pages/step4-ui-nn.qmd
    - pages/step4-ui-de.qmd

lang: en

filters:
  - path: _extensions/ctm-assessment/tab-ids.lua
    at: pre-ast
  - ctm-assessment

website:
  title: "CTM demo"
  site-url: https://aacchhee.github.io/ctm-demo/
  sidebar:
    style: docked
    contents:
      - text: "Interactive mathematics"
        file: index.qmd
      - text: "Your experiments here"
        file: pages/experiments.qmd
      - text: "Gaussian elimination"
        file: pages/gaussian-elimination.qmd
      - text: "Fysikk"
        file: pages/physics.qmd
      - text: "Fysikk-forkurs"
        file: pages/fysikk-forkurs.qmd
      - text: "Bevegelse II"
        file: pages/bevegelse-ii.qmd
      - text: "STACK-oppgaver"
        file: pages/stack-oppgaver.qmd
      - text: "Help"
        file: pages/help.qmd

format:
  html:
    theme: cosmo
    css: styles.css

ai-feedback:
  mode: api

pyodide:
  lang: en

ctm-assessment:
  markdown-lint: true
