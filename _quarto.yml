project:
  type: website
  render:
    - index.qmd
    - pages/experiments.qmd
    - pages/similar-problems.qmd
    - pages/similar-problems-authoring.qmd
    - pages/similar-problems-workflow.qmd
    - pages/gaussian-elimination.qmd
    - pages/physics.qmd
    - pages/fysikk-forkurs.qmd
    - pages/handskrift-ki.qmd
    - pages/handskrift-ki-prompter.qmd
    - pages/handwriting-ai.qmd
    - pages/handwriting-ai-prompts.qmd
    - pages/bevegelse-ii.qmd
    - pages/stack-oppgaver.qmd
    - pages/help.qmd
    - pages/step4-ui.qmd
    - pages/step4-ui-links.qmd
    - pages/step4-ui-nb.qmd
    - pages/step4-ui-nn.qmd
    - pages/step4-ui-de.qmd
  # Hentes av skript på Håndskrift og KI-siden (fyll inn-knapper og prompt-sandkasse).
  resources:
    - assets/handskrift/student1/*.png
    - assets/handskrift/student2/*.png
    - feedback/handskrift/*.yml
    - feedback/handwriting/*.yml

lang: en

filters:
  - path: _extensions/ctm-assessment/tab-ids.lua
    at: pre-ast
  - ctm-assessment

website:
  title: "CTM demo"
  site-url: https://aacchhee.github.io/ctm-demo/
  sidebar:
    style: docked
    contents:
      - text: "Interactive mathematics"
        file: index.qmd
      - text: "Your experiments here"
        file: pages/experiments.qmd
      - section: "Similar problems"
        contents:
          - text: "Examples and code"
            file: pages/similar-problems.qmd
          - text: "Authoring guide"
            file: pages/similar-problems-authoring.qmd
          - text: "Workflow and phase 2"
            file: pages/similar-problems-workflow.qmd
      - text: "Gaussian elimination"
        file: pages/gaussian-elimination.qmd
      - text: "Fysikk"
        file: pages/physics.qmd
      - text: "Fysikk-forkurs"
        file: pages/fysikk-forkurs.qmd
      - section: "Håndskrift og KI / Handwriting and AI"
        contents:
          - text: "Prøveeksamen V2025 (nb)"
            file: pages/handskrift-ki.qmd
          - text: "Spill med promptene (nb)"
            file: pages/handskrift-ki-prompter.qmd
          - text: "Practice exam V2025 (en)"
            file: pages/handwriting-ai.qmd
          - text: "Playing with the prompts (en)"
            file: pages/handwriting-ai-prompts.qmd
      - text: "Bevegelse II"
        file: pages/bevegelse-ii.qmd
      - text: "STACK-oppgaver"
        file: pages/stack-oppgaver.qmd
      - text: "Help"
        file: pages/help.qmd

format:
  html:
    theme: cosmo
    css: styles.css

ai-feedback:
  mode: api

pyodide:
  lang: en

ctm-assessment:
  markdown-lint: true
