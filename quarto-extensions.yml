# Install the full CTM Assessment suite from the selected upstream branches.
# JSXGraph shares the math-exercise checkout and therefore its exact revision.
plugins:
  - name: ai-feedback
    repo: https://github.com/Erasmus-CTM/ai-feedback.git
    ref: main
    path: _extensions/ai-feedback

  - name: math-exercise
    repo: https://github.com/Erasmus-CTM/math-exercise.git
    ref: feature/shared-feedback-integration
    path: _extensions/math-exercise

  - name: jsxgraph
    repo: https://github.com/Erasmus-CTM/math-exercise.git
    ref: feature/shared-feedback-integration
    path: _extensions/jsxgraph

  - name: py-exercise
    repo: https://github.com/Erasmus-CTM/py-exercise.git
    ref: feature/shared-feedback-integration
    path: _extensions/py-exercise

  - name: pyodide-interaktiv
    repo: https://github.com/Erasmus-CTM/pyodide-interaktiv.git
    ref: feature/shared-feedback-integration
    path: _extensions/pyodide-interaktiv

  - name: ctm-assessment
    repo: https://github.com/Erasmus-CTM/ctm-assessment.git
    ref: main
    path: _extensions/ctm-assessment

